events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name bapenda.local;

        ssl_certificate     /etc/nginx/certs/bapenda.crt;
        ssl_certificate_key /etc/nginx/certs/bapenda.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        proxy_hide_header X-Powered-By;

        location /authelia {
            proxy_pass http://iam-authelia:9091;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-URI $request_uri;
        }

        location = /authelia/api/verify {
            proxy_pass http://iam-authelia:9091/api/verify;
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            auth_request /authelia/api/verify;
            auth_request_set $user $upstream_http_remote_user;
            auth_request_set $groups $upstream_http_remote_groups;

            set $target_url $scheme://$http_host$request_uri;

            error_page 401 =302 https://$http_host/authelia/#/?rd=$target_url;

            if ($http_user_agent ~* (sqlmap|nikto|gobuster)) {
                return 403;
            }
            if ($request_uri ~* "(<script|%3Cscript|\.\.\/|union.*select|or%201=1|or%20'1'='1)") {
                return 403;
            }

            proxy_pass http://bapenda-web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Remote-User $user;
            proxy_set_header Remote-Groups $groups;
        }
    }
}